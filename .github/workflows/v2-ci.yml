name: Axsis V2 CI

on:
  push:
    branches:
      - agent/v2-foundation
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Commit generated package lock
        if: github.event_name == 'push'
        working-directory: .
        run: |
          if git diff --quiet -- v2/package-lock.json; then
            echo "package-lock.json is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/package-lock.json
          git commit -m "Lock Axsis V2 dependencies"
          git push origin HEAD:${{ github.ref_name }}

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > audit-report.json || true
          node scripts/check-production-audit.mjs audit-report.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
