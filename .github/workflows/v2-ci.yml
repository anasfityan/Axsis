name: Axsis V2 CI

on:
  push:
    branches:
      - agent/v2-foundation
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Export generated package lock
        uses: actions/upload-artifact@v4
        with:
          name: axsis-v2-package-lock
          path: v2/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > audit-report.json || true
          node scripts/check-production-audit.mjs audit-report.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
