name: Axsis V2 CI

on:
  push:
    branches:
      - agent/v2-foundation
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        working-directory: v2
        run: npm ci --no-fund --no-audit

      - name: Audit production dependencies
        working-directory: v2
        run: |
          npm audit --omit=dev --json > audit-report.json || true
          node scripts/check-production-audit.mjs audit-report.json

      - name: Lint
        working-directory: v2
        run: npm run lint

      - name: Test
        working-directory: v2
        run: npm run test

      - name: Build
        working-directory: v2
        run: npm run build
