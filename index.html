<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="موادي">
<meta name="theme-color" id="meta-theme" content="#1c1c1e">
<title>موادي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
/* ===== iOS SYSTEM COLORS ===== */
/* dark (default) */
:root{
  --bg:#000000;--bg2:#1c1c1e;--bg3:#2c2c2e;
  --sur:#1c1c1e;--sur2:#2c2c2e;--sur3:#3a3a3c;
  --bord:rgba(255,255,255,0.08);--bord2:rgba(255,255,255,0.15);
  --txt:#ffffff;--txt2:#ebebf5cc;--txt3:#ebebf599;
  --acc:#0a84ff;--acc2:#5e5ce6;
  --red:#ff453a;--grn:#30d158;--ylw:#ffd60a;--org:#ff9f0a;
  --r:12px;--rsm:8px;
}
.th-light{
  --bg:#f2f2f7;--bg2:#ffffff;--bg3:#f2f2f7;
  --sur:#ffffff;--sur2:#f2f2f7;--sur3:#e5e5ea;
  --bord:rgba(0,0,0,0.08);--bord2:rgba(0,0,0,0.14);
  --txt:#000000;--txt2:#3c3c4399;--txt3:#3c3c4366;
  --acc:#007aff;--acc2:#5856d6;
  --red:#ff3b30;--grn:#34c759;--ylw:#ffcc00;--org:#ff9500;
}
.th-gold{
  --bg:#0d0d08;--bg2:#1a1810;--bg3:#222018;
  --sur:#1a1810;--sur2:#222018;--sur3:#2a2820;
  --bord:rgba(184,152,80,0.12);--bord2:rgba(184,152,80,0.22);
  --txt:#f5edd8;--txt2:#a08858;--txt3:#5a4e30;
  --acc:#b89850;--acc2:#d4b870;
  --red:#c87060;--grn:#70a870;--ylw:#b89850;--org:#c89060;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;transition:background .2s,color .2s}
::-webkit-scrollbar{width:0;height:0}

/* ===== TOP BAR ===== */
.topbar{
  background:var(--bg2);border-bottom:0.5px solid var(--bord);
  padding:12px 16px 0;position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wordmark{font-size:24px;font-weight:900;letter-spacing:-0.5px;line-height:1}
.wm1{color:var(--txt)}
.wm2{color:var(--acc)}
.greeting{font-size:11px;color:var(--txt3);margin-top:1px}
.topbar-btns{display:flex;gap:7px;align-items:center}
.ib{
  width:34px;height:34px;border-radius:10px;
  background:var(--sur3);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--txt2);transition:opacity .15s;
}
.ib:active{opacity:.6}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib-acc{background:var(--acc)}
.ib-acc svg{stroke:#fff}

/* ===== MAIN TABS ===== */
.tabs-bar{
  display:flex;gap:3px;padding:3px;
  background:var(--sur3);border-radius:10px;margin-bottom:0;
}
.tab-btn{
  flex:1;padding:7px 0;border:none;border-radius:8px;background:transparent;
  font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;
  color:var(--txt3);cursor:pointer;transition:all .18s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.tab-btn.active{background:var(--bg2);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,0.3)}
.tab-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab-badge{font-size:10px;padding:1px 5px;border-radius:8px;background:var(--sur2);color:var(--txt3)}
.tab-btn.active .tab-badge{background:var(--acc);color:#fff}

/* ===== CONTENT ===== */
.content{padding:12px 12px 100px}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stat{background:var(--sur);border:0.5px solid var(--bord);border-radius:var(--r);padding:8px 10px;text-align:center}
.stat-n{font-size:20px;font-weight:800;color:var(--acc)}
.stat-l{font-size:10px;color:var(--txt3);margin-top:1px}

/* ===== VIEW SWITCHER ===== */
.vsw{display:flex;background:var(--sur2);border-radius:9px;padding:2px;margin-bottom:9px;gap:2px}
.vb{
  flex:1;padding:6px 0;border:none;background:transparent;
  font-family:'Cairo',sans-serif;font-size:11px;font-weight:600;
  color:var(--txt3);cursor:pointer;border-radius:7px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:all .15s;
}
.vb svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vb.active{background:var(--bg2);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* ===== DAY FILTER ===== */
.dscroll{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;margin-bottom:9px;scrollbar-width:none}
.dscroll::-webkit-scrollbar{display:none}
.dchip{
  flex-shrink:0;padding:4px 12px;border-radius:14px;
  background:var(--sur2);border:0.5px solid var(--bord);
  font-size:11px;font-weight:600;font-family:'Cairo',sans-serif;
  color:var(--txt3);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.dchip.active{background:var(--acc);border-color:var(--acc);color:#fff}

/* ===== SIZE ROW ===== */
.szrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.szlbl{font-size:10px;color:var(--txt3)}
.szpills{display:flex;gap:2px;background:var(--sur2);border-radius:7px;padding:2px}
.szp{padding:3px 9px;border-radius:5px;border:none;background:transparent;font-size:10px;font-weight:600;font-family:'Cairo',sans-serif;color:var(--txt3);cursor:pointer;transition:all .15s}
.szp.active{background:var(--acc);color:#fff}

/* ===== GRID ===== */
.grid{display:grid;gap:8px}
.grid.sm{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.md{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.lg{grid-template-columns:1fr}

/* ===== CARD ===== */
.cc{
  background:var(--sur);border:0.5px solid var(--bord);
  border-radius:var(--r);overflow:hidden;cursor:pointer;
  transition:transform .18s,opacity .15s;
  animation:fi .22s ease both;
}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cc:active{opacity:.7;transform:scale(.97)}
.cc-bar{height:3px}
.cc-body{padding:10px 11px}
.sm .cc-body{padding:7px 8px}
.lg .cc-body{padding:13px 14px}
.cc-name{font-weight:700;color:var(--txt);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sm .cc-name{font-size:11px;-webkit-line-clamp:1}
.md .cc-name{font-size:13px}
.lg .cc-name{font-size:15px}
.cc-sub{font-size:10px;color:var(--txt3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm .cc-sub{display:none}
.cc-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.sm .cc-tags{display:none}
.cc-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px}
.cc-time{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:10px;color:var(--txt3)}
.cc-time svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.sm .cc-time{font-size:9px;margin-top:3px}
.sm .cc-time svg{display:none}
/* exam card accent */
.exam-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;margin-top:5px;background:rgba(255,159,10,.15);color:var(--org)}

/* ===== LIST ===== */
.lw{display:flex;flex-direction:column;gap:7px}
.li{background:var(--sur);border:0.5px solid var(--bord);border-radius:var(--r);display:flex;align-items:stretch;overflow:hidden;cursor:pointer;transition:opacity .15s;animation:fi .2s ease both}
.li:active{opacity:.6}
.li-stripe{width:4px;flex-shrink:0}
.li-body{flex:1;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.li-ln{font-size:13px;font-weight:700;color:var(--txt)}
.li-ls{font-size:11px;color:var(--txt3);margin-top:1px}
.li-day{font-size:11px;font-weight:700;color:var(--acc);text-align:left}
.li-time{font-size:10px;color:var(--txt3)}
.li-room{font-size:9px;color:var(--txt3);margin-top:1px}

/* ===== SCHEDULE ===== */
.sw{display:flex;flex-direction:column;gap:12px}
.s-dh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.s-dn{font-size:11px;font-weight:700;color:var(--txt3);white-space:nowrap}
.s-dl{flex:1;height:0.5px;background:var(--bord2)}
.s-dc{font-size:9px;background:var(--sur2);color:var(--txt3);padding:2px 6px;border-radius:8px}
.si{background:var(--sur);border:0.5px solid var(--bord);border-radius:9px;display:flex;align-items:center;gap:8px;padding:8px 11px;margin-bottom:5px;cursor:pointer;transition:opacity .15s;animation:fi .2s ease both}
.si:active{opacity:.6}
.si-time{font-size:10px;color:var(--txt3);min-width:68px;font-weight:600}
.si-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.si-n{font-size:12px;font-weight:700;color:var(--txt)}
.si-s{font-size:10px;color:var(--txt3)}
.conflict-w{background:rgba(255,69,58,.1);border:0.5px solid rgba(255,69,58,.25);border-radius:9px;padding:6px 10px;margin-bottom:7px;font-size:11px;color:var(--red);display:flex;align-items:center;gap:6px}
.conflict-w svg{width:12px;height:12px;stroke:var(--red);fill:none;stroke-width:2;flex-shrink:0}

/* ===== EXAM INFO ROW (in schedule) ===== */
.si-exam-date{font-size:9px;color:var(--org);font-weight:600;margin-top:2px}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:48px 20px;color:var(--txt3)}
.empty-ico{width:50px;height:50px;margin:0 auto 12px;background:var(--sur2);border-radius:14px;display:flex;align-items:center;justify-content:center}
.empty-ico svg{width:24px;height:24px;stroke:var(--txt3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty p{font-size:13px;color:var(--txt2)}.empty small{font-size:11px;color:var(--txt3)}

/* ===== OVERLAYS ===== */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.open{display:flex;animation:fov .18s ease}
@keyframes fov{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:12px 16px 40px;max-height:92vh;overflow-y:auto;animation:su .26s cubic-bezier(.32,1.1,.64,1)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh{width:36px;height:4px;background:var(--sur3);border-radius:2px;margin:0 auto 14px}
.st{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--txt)}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--txt3);margin-bottom:4px;letter-spacing:.2px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 13px;background:var(--sur3);
  border:0.5px solid var(--bord2);border-radius:10px;
  font-size:14px;font-family:'Cairo',sans-serif;color:var(--txt);
  outline:none;transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}
.field textarea{resize:none;height:60px}
.field select option{background:var(--bg2);color:var(--txt)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crow{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.cdot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.cdot.sel{border-color:var(--txt);transform:scale(1.18)}
.mbtns{display:flex;gap:7px;margin-top:16px}
.mb{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:opacity .15s;border:none}
.mb:active{opacity:.7}
.mb-c{background:var(--sur3);color:var(--txt2)}
.mb-s{background:var(--acc);color:#fff}
.mb-d{background:rgba(255,69,58,.15);color:var(--red);flex:.5}

/* ===== DETAIL ===== */
.det-bar{height:4px;border-radius:2px;width:52px;margin:0 auto 12px}
.det-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.det-ico{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.det-ico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.det-name{font-size:18px;font-weight:900;color:var(--txt);line-height:1.2}
.det-dept{font-size:12px;color:var(--txt3);margin-top:2px}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px}
.dc{background:var(--sur3);border-radius:10px;padding:9px 11px}
.dcl{font-size:9px;color:var(--txt3);margin-bottom:2px;letter-spacing:.4px}
.dcv{font-size:13px;font-weight:700;color:var(--txt)}
.det-notes{background:var(--sur3);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.det-acts{display:flex;gap:7px}
.da{flex:1;padding:12px;border-radius:10px;font-size:12px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;border:0.5px solid var(--bord2);background:var(--sur3);color:var(--txt2);transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.da svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.da:active{opacity:.6}
.da.edit{background:var(--acc);border-color:var(--acc);color:#fff}
.da.del{background:rgba(255,69,58,.12);border-color:rgba(255,69,58,.25);color:var(--red)}

/* ===== SETTINGS ===== */
.set-row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--sur3);border-radius:10px;padding:12px 14px;
  margin-bottom:8px;cursor:pointer;transition:opacity .15s;
}
.set-row:active{opacity:.6}
.set-row-left{display:flex;align-items:center;gap:10px}
.set-row-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.set-row-icon svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.set-row-lbl{font-size:14px;font-weight:600;color:var(--txt)}
.set-row-val{font-size:12px;color:var(--txt3)}
.set-row-arrow{color:var(--txt3);font-size:14px}
.set-credit{text-align:center;margin-top:20px;font-size:11px;color:var(--txt3)}

/* ===== THEME PICKER (compact) ===== */
.theme-opts{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.theme-opt{
  display:flex;align-items:center;gap:12px;padding:11px 13px;
  background:var(--sur3);border-radius:10px;cursor:pointer;
  border:1.5px solid transparent;transition:all .15s;
}
.theme-opt.sel{border-color:var(--acc)}
.theme-swatch{width:28px;height:28px;border-radius:8px;flex-shrink:0}
.theme-opt-name{font-size:13px;font-weight:600;color:var(--txt);flex:1}
.theme-check{color:var(--acc);font-size:16px}

/* ===== LANG PICKER (compact) ===== */
.lang-opts{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.lang-opt{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--sur3);border-radius:10px;cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.lang-opt.sel{border-color:var(--acc)}
.lang-flag{font-size:20px;line-height:1}
.lang-name{font-size:13px;font-weight:600;color:var(--txt);flex:1}

/* ===== SUB SHEET (for theme/lang picker) ===== */
.sub-sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:12px 16px 40px;max-height:70vh;overflow-y:auto;animation:su .26s cubic-bezier(.32,1.1,.64,1)}
</style>
</head>
<body class="th-dark">
<div style="max-width:480px;margin:0 auto">

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-row">
    <div>
      <div class="wordmark"><span class="wm1" id="wm1">موا</span><span class="wm2" id="wm2">دي</span></div>

      </div>
      <div class="ib ib-acc" onclick="playClick();openAdd()">

      <span id="te-lbl">الاختبارات</span><span class="tab-badge" id="te-n">0</span>
    </button>
  </div>
</div>

<div class="content" id="content"></div>
</div>

<!-- ADD/EDIT COURSE OVERLAY -->
<div class="ov" id="ov-add" onclick="ovClick(event,'ov-add')">
<div class="sheet">
  <div class="sh"></div>
  <div class="st" id="add-title">إضافة مادة</div>
  <input type="hidden" id="eid">
  <div class="field"><label id="l-name">الاسم</label><input id="f-name" type="text"></div>
  <div class="field"><label id="l-doc">الدكتور</label><input id="f-doc" type="text"></div>

  <div class="r2">
    <div class="field"><label id="l-day">اليوم</label><select id="f-day"></select></div>
    <div class="field"><label id="l-room">القاعة</label><input id="f-room" type="text"></div>
  </div>
  <div class="r2">
    <div class="field"><label id="l-s">البداية</label><input id="f-s" type="time" value="08:00"></div>
    <div class="field"><label id="l-e">النهاية</label><input id="f-e" type="time" value="10:00"></div>

// ===== AUDIO =====
let actx=null;
function playClick(){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    o.type='sine';o.frequency.setValueAtTime(800,actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(500,actx.currentTime+.07);
    g.gain.setValueAtTime(.06,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.09);
    o.start();o.stop(actx.currentTime+.09);
  }catch(e){}
}
function playOk(){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    [440,554,659].forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.value=f;
      const t=actx.currentTime+i*.1;
      g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);
      o.start(t);o.stop(t+.15);
    });
  }catch(e){}
}

// ===== LOCALSTORAGE =====
function lsGet(k,def){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):def}catch(e){return def}}
function lsSave(){
  try{
    localStorage.setItem('mw_courses',JSON.stringify(courses));
    localStorage.setItem('mw_exams',JSON.stringify(exams));
    localStorage.setItem('mw_nid',''+nid);

// ===== STATE =====
let lang=localStorage.getItem('mw_lang')||'ar';
let currentTheme=localStorage.getItem('mw_theme')||'th-dark';
let view=localStorage.getItem('mw_view')||'grid';
let sz=localStorage.getItem('mw_sz')||'md';
let tab='courses',filter='all';
let eid=null,selC=0;

// Apply saved theme immediately
document.body.className=currentTheme;

// courses: each has id,name,doc,dept,day,s,e,room,notes,ci
let courses=lsGet('mw_courses',[
  {id:1,name:'رياضيات 2',doc:'د. محمد علي',dept:'علوم حاسوب',day:'الاثنين',s:'08:00',e:'10:00',room:'A101',notes:'',ci:0},
  {id:2,name:'برمجة متقدمة',doc:'د. سارة خالد',dept:'علوم حاسوب',day:'الثلاثاء',s:'10:00',e:'12:00',room:'B204',notes:'',ci:1},
]);
// exams: keyed by course id — {date,day,time,room,notes}
// each exam links to a course by courseId
let exams=lsGet('mw_exams',{});
let nid=parseInt(localStorage.getItem('mw_nid')||'10');

// ===== RENDER =====
function render(){
  updateLabels();
  const cont=document.getElementById('content');
  const list=courses;
  const ud=new Set(list.map(c=>c.day)).size;
  const ude=new Set(list.map(c=>c.dept||'').filter(Boolean)).size;

  let h='';

  // Stats
  const examCount=Object.keys(exams).length;
  h+=`<div class="stats">
    <div class="stat"><div class="stat-n">${list.length}</div><div class="stat-l">${t('total')}</div></div>
    <div class="stat"><div class="stat-n">${ud}</div><div class="stat-l">${t('days')}</div></div>
    <div class="stat"><div class="stat-n">${examCount}</div><div class="stat-l">${t('exams')}</div></div>
  </div>`;

  // View switcher
  h+=`<div class="vsw">
    <button class="vb${view==='grid'?' active':''}" onclick="playClick();setView('grid')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>${t('grid')}</button>
    <button class="vb${view==='list'?' active':''}" onclick="playClick();setView('list')"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>${t('list')}</button>
    <button class="vb${view==='schedule'?' active':''}" onclick="playClick();setView('schedule')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${t('schedule')}</button>
  </div>`;

  if(tab==='courses'){
    // Day filter
    const days=getDays();
    h+=`<div class="dscroll"><button class="dchip${filter==='all'?' active':''}" onclick="playClick();setFilter('all')">${t('all')}</button>${DAR.map((d,i)=>`<button class="dchip${filter===d?' active':''}" onclick="playClick();setFilter('${d}')">${days[i]}</button>`).join('')}</div>`;
    // Size toggle
    if(view==='grid')h+=`<div class="szrow"><span class="szlbl">${t('size')}</span><div class="szpills"><button class="szp${sz==='sm'?' active':''}" onclick="playClick();setSz('sm')">${t('small')}</button><button class="szp${sz==='md'?' active':''}" onclick="playClick();setSz('md')">${t('medium')}</button><button class="szp${sz==='lg'?' active':''}" onclick="playClick();setSz('lg')">${t('large')}</button></div></div>`;
    const fil=filter==='all'?list:list.filter(c=>c.day===filter);
    if(!fil.length){h+=emptyHTML();} else if(view==='grid'){h+=`<div class="grid ${sz}">${fil.map((c,i)=>courseCardH(c,i)).join('')}</div>`;}
    else if(view==='list'){h+=`<div class="lw">${fil.map((c,i)=>courseListH(c,i)).join('')}</div>`;}
    else{h+=courseSchedH(fil);}
  } else {
    // EXAMS TAB — show all courses with their exam info
    if(view==='grid'){h+=`<div class="grid ${sz}">${list.map((c,i)=>examCardH(c,i)).join('')}</div>`;}
    else if(view==='list'){h+=`<div class="lw">${list.map((c,i)=>examListH(c,i)).join('')}</div>`;}
    else{h+=examSchedH();}
  }

  cont.innerHTML=h;
}

// ===== COURSE CARD HTML =====
function courseCardH(c,i){
  const col=COLS[c.ci||0];
  const bc=sz==='sm'?'sm':sz==='lg'?'lg':'';
  return`<div class="cc" onclick="playClick();openCourseDet(${c.id})" style="animation-delay:${i*.04}s">
    <div class="cc-bar" style="background:${col.b}"></div>
    <div class="cc-body ${bc}">
      <div class="cc-name">${c.name}</div>
      <div class="cc-sub">${c.doc||''}</div>
      <div class="cc-tags">${c.dept?`<span class="cc-tag" style="background:${col.bg};color:${col.tx}">${c.dept}</span>`:''}
        <span class="cc-tag" style="background:var(--sur3);color:var(--txt3)">${dLabel(c.day)}</span>
      </div>
      <div class="cc-time"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>${c.s}–${c.e}</div>
    </div></div>`;
}
function courseListH(c,i){
  const col=COLS[c.ci||0];
  return`<div class="li" onclick="playClick();openCourseDet(${c.id})" style="animation-delay:${i*.04}s">
    <div class="li-stripe" style="background:${col.b}"></div>
    <div class="li-body">
      <div><div class="li-ln">${c.name}</div><div class="li-ls">${[c.doc,c.dept].filter(Boolean).join(' · ')}</div></div>
      <div style="text-align:left"><div class="li-day">${dLabel(c.day)}</div><div class="li-time">${c.s}–${c.e}</div>${c.room?`<div class="li-room">${c.room}</div>`:''}</div>
    </div></div>`;
}
function courseSchedH(fil){
  const byDay={};DAR.forEach(d=>{byDay[d]=[]});
  fil.forEach(c=>{if(byDay[c.day])byDay[c.day].push(c)});
  const active=DAR.filter(d=>byDay[d].length>0&&(filter==='all'||filter===d));
  if(!active.length)return emptyHTML();
  let h='<div class="sw">';
  active.forEach(day=>{
    const dc=byDay[day].sort((a,b)=>a.s.localeCompare(b.s));
    const conf=new Set();
    for(let a=0;a<dc.length;a++)for(let b=a+1;b<dc.length;b++){
      if(dc[a].s<dc[b].e&&dc[a].e>dc[b].s){conf.add(dc[a].id);conf.add(dc[b].id)}
    }
    h+=`<div><div class="s-dh"><span class="s-dn">${dLabel(day)}</span><div class="s-dl"></div><span class="s-dc">${dc.length}</span></div>`;
    if(conf.size)h+=`<div class="conflict-w"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>${t('conflict')}</div>`;
    dc.forEach(c=>{
      const col=COLS[c.ci||0];
      h+=`<div class="si" onclick="playClick();openCourseDet(${c.id})">
        <div class="si-time">${c.s}–${c.e}</div>
        <div class="si-dot" style="background:${col.b}"></div>
        <div><div class="si-n">${c.name}</div><div class="si-s">${[c.room,c.doc].filter(Boolean).join(' · ')}</div></div>
        ${conf.has(c.id)?`<span style="font-size:12px;color:var(--red)">⚠</span>`:''}
      </div>`;
    });
    h+='</div>';
  });
  return h+'</div>';
}

// ===== EXAM CARD HTML =====
function examCardH(c,i){
  const col=COLS[c.ci||0];
  const ex=exams[c.id];
  const bc=sz==='sm'?'sm':sz==='lg'?'lg':'';
  const hasExam=ex&&ex.date;
  return`<div class="cc" onclick="playClick();openExamEdit(${c.id})" style="animation-delay:${i*.04}s">
    <div class="cc-bar" style="background:${hasExam?'var(--org)':col.b}"></div>
    <div class="cc-body ${bc}">
      <div class="cc-name">${c.name}</div>
      <div class="cc-sub">${c.doc||''}</div>
      <div class="cc-tags">
        ${c.dept?`<span class="cc-tag" style="background:${col.bg};color:${col.tx}">${c.dept}</span>`:''}
      </div>
      ${hasExam
        ?`<div class="exam-badge">📅 ${ex.date} ${ex.time||''}</div>`
        :`<div style="font-size:10px;color:var(--txt3);margin-top:5px">+ ${t('setExam')}</div>`
      }
    </div></div>`;
}
function examListH(c,i){
  const col=COLS[c.ci||0];
  const ex=exams[c.id];
  const hasExam=ex&&ex.date;
  return`<div class="li" onclick="playClick();openExamEdit(${c.id})" style="animation-delay:${i*.04}s">
    <div class="li-stripe" style="background:${hasExam?'var(--org)':col.b}"></div>
    <div class="li-body">
      <div><div class="li-ln">${c.name}</div><div class="li-ls">${c.dept||''}</div></div>
      <div style="text-align:left">
        ${hasExam?`<div class="li-day" style="color:var(--org)">${ex.date}</div><div class="li-time">${ex.time||''}${ex.room?' · '+ex.room:''}</div>`
          :`<div style="font-size:11px;color:var(--txt3)">${t('noExam')}</div>`}
      </div>
    </div></div>`;
}
function examSchedH(){
  // Group exams by date
  const byDate={};
  courses.forEach(c=>{
    const ex=exams[c.id];
    if(ex&&ex.date){
      if(!byDate[ex.date])byDate[ex.date]=[];
      byDate[ex.date].push({c,ex});
    }
  });
  const dates=Object.keys(byDate).sort();
  if(!dates.length){
    return`<div class="empty"><div class="empty-ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><p>${t('noExam')}</p><small>${t('emptySub')}</small></div>`;
  }
  let h='<div class="sw">';
  dates.forEach(date=>{
    const items=byDate[date].sort((a,b)=>(a.ex.time||'').localeCompare(b.ex.time||''));
    h+=`<div><div class="s-dh"><span class="s-dn">${date}</span><div class="s-dl"></div><span class="s-dc">${items.length}</span></div>`;
    items.forEach(({c,ex})=>{
      const col=COLS[c.ci||0];
      h+=`<div class="si" onclick="playClick();openExamEdit(${c.id})">
        <div class="si-time">${ex.time||'—'}</div>
        <div class="si-dot" style="background:var(--org)"></div>
        <div><div class="si-n">${c.name}</div><div class="si-s">${[ex.room,c.dept].filter(Boolean).join(' · ')}</div></div>
      </div>`;
    });
    h+='</div>';
  });
  return h+'</div>';
}

function emptyHTML(){
  return`<div class="empty"><div class="empty-ico"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/></svg></div><p>${t('empty')}</p><small>${t('emptySub')}</small></div>`;
}

// ===== COURSE DETAIL =====
function openCourseDet(id){
  const c=courses.find(x=>x.id===id);if(!c)return;
  const col=COLS[c.ci||0];
  document.getElementById('det-body').innerHTML=`
    <div class="det-bar" style="background:${col.b}"></div>
    <div class="det-head">
      <div class="det-ico" style="background:${col.b}"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="13" y2="11"/></svg></div>
      <div><div class="det-name">${c.name}</div><div class="det-dept">${c.dept||''}</div></div>
    </div>
    <div class="det-grid">
      <div class="dc"><div class="dcl">${t('day')}</div><div class="dcv">${dLabel(c.day)}</div></div>
      <div class="dc"><div class="dcl">${t('start')}–${t('end')}</div><div class="dcv">${c.s}–${c.e}</div></div>
      <div class="dc"><div class="dcl">${t('room')}</div><div class="dcv">${c.room||'—'}</div></div>
      <div class="dc"><div class="dcl">${t('doctor')}</div><div class="dcv">${c.doc||'—'}</div></div>
    </div>
    ${c.notes?`<div class="det-notes"><div style="font-size:9px;color:var(--txt3);margin-bottom:4px">${t('notes')}</div><div style="font-size:12px;color:var(--txt2);line-height:1.7">${c.notes}</div></div>`:''}
    <div class="det-acts">
      <button class="da del" onclick="playClick();closeDet();eid=${c.id};delCourse()">
        <svg viewBox="0 0 24 24"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/></svg>${t('del')}
      </button>
      <button class="da edit" onclick="playClick();closeDet();openEditCourse(${c.id})">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>${t('edit')}
      </button>
    </div>`;
  document.getElementById('ov-det').classList.add('open');
}
function closeDet(){document.getElementById('ov-det').classList.remove('open')}

// ===== ADD COURSE =====
function buildDaySelect(){
  const s=document.getElementById('f-day');if(!s)return;
  const cur=s.value;
  s.innerHTML=DAR.map((d,i)=>`<option value="${d}"${d===cur?' selected':''}>${getDays()[i]}</option>`).join('');
}
function buildColorRow(sel,rowId){
  selC=sel;
  document.getElementById(rowId).innerHTML=COLS.map((c,i)=>
    `<div class="cdot${i===sel?' sel':''}" style="background:${c.b}" onclick="pickC(${i},'${rowId}')"></div>`
  ).join('');
}
function pickC(i,rowId){selC=i;buildColorRow(i,rowId)}

function openAdd(){
  eid=null;
  document.getElementById('eid').value='';
  document.getElementById('add-title').textContent=t('addCourse');
  document.getElementById('del-btn').style.display='none';
  clearCourseForm();buildColorRow(0,'crow-c');buildDaySelect();
  document.getElementById('ov-add').classList.add('open');
}
function openEditCourse(id){
  const c=courses.find(x=>x.id===id);if(!c)return;
  eid=id;
  document.getElementById('eid').value=id;
  document.getElementById('add-title').textContent=t('editCourse');
  document.getElementById('del-btn').style.display='inline-flex';
  document.getElementById('f-name').value=c.name||'';
  document.getElementById('f-doc').value=c.doc||'';
  document.getElementById('f-dept').value=c.dept||'';
  document.getElementById('f-room').value=c.room||'';
  document.getElementById('f-s').value=c.s||'08:00';
  document.getElementById('f-e').value=c.e||'10:00';
  document.getElementById('f-notes').value=c.notes||'';
  buildDaySelect();document.getElementById('f-day').value=c.day||DAR[0];
  buildColorRow(c.ci||0,'crow-c');
  document.getElementById('ov-add').classList.add('open');
}
function clearCourseForm(){
  ['f-name','f-doc','f-dept','f-room','f-notes'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
  document.getElementById('f-s').value='08:00';document.getElementById('f-e').value='10:00';
}
function saveCourse(){
  const name=document.getElementById('f-name').value.trim();
  if(!name)return;
  if(eid!==null){
    const idx=courses.findIndex(c=>c.id===eid);
    if(idx>=0)courses[idx]={...courses[idx],name,doc:document.getElementById('f-doc').value.trim(),dept:document.getElementById('f-dept').value.trim(),day:document.getElementById('f-day').value,s:document.getElementById('f-s').value,e:document.getElementById('f-e').value,room:document.getElementById('f-room').value.trim(),notes:document.getElementById('f-notes').value.trim(),ci:selC};
  } else {
    courses.push({id:nid++,name,doc:document.getElementById('f-doc').value.trim(),dept:document.getElementById('f-dept').value.trim(),day:document.getElementById('f-day').value,s:document.getElementById('f-s').value,e:document.getElementById('f-e').value,room:document.getElementById('f-room').value.trim(),notes:document.getElementById('f-notes').value.trim(),ci:selC});
  }
  playOk();lsSave();closeAdd();render();
}
function delCourse(){
  if(!confirm(lang==='ar'?'حذف هذه المادة؟':lang==='tr'?'Sil?':'Delete?'))return;
  const id=eid;
  courses=courses.filter(c=>c.id!==id);
  delete exams[id];
  lsSave();closeAdd();render();
}
function closeAdd(){document.getElementById('ov-add').classList.remove('open')}

// ===== EXAM EDIT =====
function openExamEdit(courseId){
  const c=courses.find(x=>x.id===courseId);if(!c)return;
  const ex=exams[courseId]||{};
  document.getElementById('exam-cid').value=courseId;
  document.getElementById('exam-course-name').textContent=c.name;
  document.getElementById('exam-sheet-title').textContent=ex.date?t('editExam'):t('setExam');
  document.getElementById('f-edate').value=ex.date||new Date().toISOString().split('T')[0];
  document.getElementById('f-etime').value=ex.time||'09:00';
  document.getElementById('f-eroom').value=ex.room||c.room||'';
  document.getElementById('f-enotes').value=ex.notes||'';
  // auto-fill day from date
  const fd=document.getElementById('f-edate');
  fd.oninput=()=>{
    const d=new Date(fd.value);
    if(!isNaN(d)){
      const dayNames=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
      document.getElementById('f-eday').value=dayNames[d.getDay()];
    }
  };
  fd.oninput();
  document.getElementById('ov-exam').classList.add('open');
}
function saveExam(){
  const cid=parseInt(document.getElementById('exam-cid').value);
  const date=document.getElementById('f-edate').value;
  if(!date)return;
  exams[cid]={date,day:document.getElementById('f-eday').value,time:document.getElementById('f-etime').value,room:document.getElementById('f-eroom').value.trim(),notes:document.getElementById('f-enotes').value.trim()};
  playOk();lsSave();closeExam();render();
}
function closeExam(){document.getElementById('ov-exam').classList.remove('open')}

// ===== SETTINGS =====
function openSettings(){document.getElementById('ov-set').classList.add('open')}
function closeSettings(){document.getElementById('ov-set').classList.remove('open')}
function openThemePicker(){document.getElementById('ov-theme').classList.add('open')}
function closeThemePicker(){document.getElementById('ov-theme').classList.remove('open')}
function openLangPicker(){document.getElementById('ov-lang').classList.add('open')}
function closeLangPicker(){document.getElementById('ov-lang').classList.remove('open')}

function setTheme(cls,el){
  document.body.className=cls;currentTheme=cls;
  document.querySelectorAll('.theme-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
  ['dark','light','gold'].forEach(n=>{
    const chk=document.getElementById('thc-'+n);
    if(chk)chk.style.display=cls==='th-'+n?'':'none';
  });
  document.getElementById('s-theme-val').textContent=TH_NAMES[cls][lang]||cls;
  lsSave();
}
function setLang(l,el){
  lang=l;
  document.querySelectorAll('.lang-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
  ['ar','en','tr'].forEach(x=>{const c=document.getElementById('lc-'+x);if(c)c.style.display=x===l?'':'none'});
  document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.documentElement.lang=l;
  document.getElementById('s-lang-val').textContent=LANG_NAMES[l];
  buildDaySelect();lsSave();updateLabels();render();
}
function updateLabels(){
  const h=new Date().getHours();
  const greet={ar:h<12?'صباح الخير 🌅':h<18?'مساء الخير ☀️':'مساء النور 🌙',en:h<12?'Good morning 🌅':h<18?'Good afternoon ☀️':'Good evening 🌙',tr:h<12?'Günaydın 🌅':h<18?'İyi günler ☀️':'İyi akşamlar 🌙'};
  const wms={ar:['موا','دي'],en:['Mawa','di'],tr:['Ders','lerim']};
  const wm=wms[lang]||wms.ar;
  document.getElementById('wm1').textContent=wm[0];
  document.getElementById('wm2').textContent=wm[1];
  document.getElementById('greeting').textContent=greet[lang];
  document.getElementById('tc-lbl').textContent=t('courses');
  document.getElementById('te-lbl').textContent=t('exams');
  document.getElementById('tc-n').textContent=courses.length;
  document.getElementById('te-n').textContent=Object.keys(exams).length;
  document.getElementById('s-title').textContent=t('settings');
  document.getElementById('s-done').textContent=t('done');
  document.getElementById('s-theme-lbl').textContent=t('theme');
  document.getElementById('s-lang-lbl').textContent=t('lang');
  document.getElementById('s-theme-val').textContent=TH_NAMES[currentTheme]?.[lang]||'';
  document.getElementById('s-lang-val').textContent=LANG_NAMES[lang];
  // theme/lang picker
  ['dark','light','gold'].forEach(n=>{const el=document.getElementById('th-'+n+'-name');if(el)el.textContent=TH_NAMES['th-'+n][lang]});
  // restore lang selection UI
  document.querySelectorAll('.lang-opt').forEach(e=>{e.classList.toggle('sel',e.dataset.l===lang)});
  ['ar','en','tr'].forEach(x=>{const c=document.getElementById('lc-'+x);if(c)c.style.display=x===lang?'':'none'});
  // restore theme selection UI
  document.querySelectorAll('.theme-opt').forEach(e=>{e.classList.toggle('sel',e.dataset.t===currentTheme)});
  ['dark','light','gold'].forEach(n=>{const c=document.getElementById('thc-'+n);if(c)c.style.display='th-'+n===currentTheme?'':'none'});
}
// ===== MISC =====
function setView(v){view=v;lsSave();render()}
function setFilter(f){filter=f;render()}
function setSz(s){sz=s;lsSave();render()}
function switchTab(t2){
  tab=t2;filter='all';
  document.getElementById('tab-c').classList.toggle('active',t2==='courses');
  document.getElementById('tab-e').classList.toggle('active',t2==='exams');
  render();
}
function ovClick(e,id){if(e.target===document.getElementById(id))document.getElementById(id).classList.remove('open')}

// ===== INIT =====
updateLabels();render();
</script>
