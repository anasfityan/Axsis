<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="موادي">
<meta name="application-name" content="موادي">
<meta name="theme-color" id="meta-theme" content="#0f0f1a">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;موادي — University Planner&quot;,&quot;short_name&quot;:&quot;موادي&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#0f0f1a&quot;,&quot;theme_color&quot;:&quot;#6c63ff&quot;,&quot;orientation&quot;:&quot;portrait&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%236c63ff'/><text y='340' font-size='280' text-anchor='middle' x='256' fill='white' font-family='serif'>م</text></svg>&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;,&quot;purpose&quot;:&quot;any maskable&quot;}]}">
<title>موادي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
/* ===== THEMES ===== */
:root{
  --bg:#0f0f1a;--bg2:#16162a;--bg3:#1e1e35;
  --sur:#1e1e35;--sur2:#252540;--sur3:#2e2e50;
  --bord:rgba(255,255,255,0.07);--bord2:rgba(255,255,255,0.14);
  --txt:#f0f0ff;--txt2:#8888b8;--txt3:#4a4a70;
  --acc:#6c63ff;--acc2:#a78bfa;
  --r:12px;--rsm:8px;--rlg:18px;
}
.th-light{
  --bg:#f0eff8;--bg2:#e8e7f4;--bg3:#fff;
  --sur:#fff;--sur2:#f0eff8;--sur3:#e4e3f5;
  --bord:rgba(0,0,0,0.07);--bord2:rgba(0,0,0,0.13);
  --txt:#1a1a2e;--txt2:#6060a0;--txt3:#9898c0;
  --acc:#6c63ff;--acc2:#7c6fef;
}
.th-dark{
  --bg:#0f0f1a;--bg2:#16162a;--bg3:#1e1e35;
  --sur:#1e1e35;--sur2:#252540;--sur3:#2e2e50;
  --bord:rgba(255,255,255,0.07);--bord2:rgba(255,255,255,0.14);
  --txt:#f0f0ff;--txt2:#8888b8;--txt3:#4a4a70;
  --acc:#6c63ff;--acc2:#a78bfa;
}
.th-gold{
  --bg:#0e0c06;--bg2:#16130a;--bg3:#1f1a0e;
  --sur:#1f1a0e;--sur2:#27210f;--sur3:#302816;
  --bord:rgba(255,210,80,0.1);--bord2:rgba(255,210,80,0.2);
  --txt:#fff8e0;--txt2:#c8a84b;--txt3:#806830;
  --acc:#d4a017;--acc2:#f5c842;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:'Cairo',sans-serif;
  background:var(--bg);color:var(--txt);
  min-height:100vh;overflow-x:hidden;
  transition:background .25s,color .25s;
}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--bord2);border-radius:2px}

/* ===== TOPBAR ===== */
.topbar{
  padding:10px 14px 0;
  background:var(--bg2);
  position:sticky;top:0;z-index:100;
}
.topbar-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.app-wordmark{
  font-size:22px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.topbar-right{display:flex;align-items:center;gap:6px}
.ib{
  width:34px;height:34px;border-radius:9px;
  background:var(--sur2);border:1px solid var(--bord);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--txt2);transition:all .15s;
}
.ib:hover{background:var(--sur3);color:var(--txt)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.add-ib{background:var(--acc);border-color:var(--acc);color:#fff}
.add-ib:hover{opacity:.88}
.add-ib svg{stroke:#fff}

/* ===== MAIN TABS (glassmorphism) ===== */
.main-tabs{
  display:flex;gap:4px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--bord);
  border-radius:10px;
  padding:3px;
  backdrop-filter:blur(10px);
  margin:0 0 0;
}
.main-tab{
  flex:1;padding:7px 0;border:none;border-radius:7px;
  font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;
  color:var(--txt2);cursor:pointer;background:transparent;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:all .18s;
}
.main-tab.active{
  background:var(--acc);color:#fff;
}
.main-tab svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab-badge{
  font-size:10px;padding:1px 5px;border-radius:8px;
  background:rgba(255,255,255,0.15);
}
.main-tab:not(.active) .tab-badge{background:var(--sur3);color:var(--txt3)}

/* ===== CONTENT ===== */
.content{padding:12px 12px 90px;max-width:480px;margin:0 auto}

/* ===== STATS ===== */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stat{
  background:var(--sur);border:1px solid var(--bord);
  border-radius:var(--r);padding:8px 10px;text-align:center;
}
.stat-num{font-size:18px;font-weight:900;color:var(--acc)}
.stat-lbl{font-size:10px;color:var(--txt2);margin-top:1px}

/* ===== VIEW SWITCHER ===== */
.vsw{
  display:flex;gap:0;margin-bottom:10px;
  background:var(--sur);border:1px solid var(--bord);
  border-radius:var(--rsm);padding:3px;
}
.vbtn{
  flex:1;padding:6px 0;border:none;background:transparent;
  font-family:'Cairo',sans-serif;font-size:11px;font-weight:600;
  color:var(--txt2);cursor:pointer;border-radius:5px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:all .15s;
}
.vbtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vbtn.active{background:var(--acc);color:#fff}

/* ===== DAY FILTER ===== */
.day-scroll{
  display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;
  margin-bottom:10px;scrollbar-width:none;
}
.day-scroll::-webkit-scrollbar{display:none}
.dchip{
  flex-shrink:0;padding:4px 11px;border-radius:16px;
  background:var(--sur);border:1px solid var(--bord);
  font-size:11px;font-weight:600;font-family:'Cairo',sans-serif;
  color:var(--txt2);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.dchip.active{background:var(--acc);border-color:var(--acc);color:#fff}

/* ===== SIZE TOGGLE ===== */
.size-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.size-lbl{font-size:10px;color:var(--txt3)}
.size-pills{display:flex;gap:3px;background:var(--sur);border:1px solid var(--bord);border-radius:var(--rsm);padding:2px}
.spill{
  padding:3px 9px;border-radius:5px;border:none;background:transparent;
  font-size:10px;font-weight:600;font-family:'Cairo',sans-serif;
  color:var(--txt2);cursor:pointer;transition:all .15s;
}
.spill.active{background:var(--acc);color:#fff}

/* ===== CARDS ===== */
.grid{display:grid;gap:8px}
.grid.sm{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.md{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.lg{grid-template-columns:1fr}

.cc{
  background:var(--sur);border:1px solid var(--bord);
  border-radius:var(--r);overflow:hidden;cursor:pointer;
  transition:transform .18s,border-color .18s;
  animation:fi .22s ease both;
}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.cc:hover{transform:translateY(-2px);border-color:var(--bord2)}
.cc:active{transform:scale(.97)}
.cc-bar{height:4px;width:100%}
.cc-body{padding:10px 11px}
.cc-body.sm{padding:7px 8px}
.cc-body.lg{padding:13px 14px}
.cc-name{font-weight:700;color:var(--txt);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.grid.sm .cc-name{font-size:10px;-webkit-line-clamp:1}
.grid.md .cc-name{font-size:12px}
.grid.lg .cc-name{font-size:14px}
.cc-sub{font-size:10px;color:var(--txt2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.sm .cc-sub{display:none}
.cc-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.grid.sm .cc-tags{display:none}
.cc-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px}
.cc-time{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:10px;color:var(--txt2)}
.cc-time svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.grid.sm .cc-time{font-size:9px;margin-top:3px}
.grid.sm .cc-time svg{display:none}

/* ===== LIST VIEW ===== */
.lw{display:flex;flex-direction:column;gap:7px}
.li{
  background:var(--sur);border:1px solid var(--bord);
  border-radius:var(--r);display:flex;align-items:stretch;
  overflow:hidden;cursor:pointer;transition:all .15s;
  animation:fi .2s ease both;
}
.li:hover{border-color:var(--bord2)}
.li-stripe{width:4px;flex-shrink:0}
.li-body{flex:1;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.li-left .ln{font-size:13px;font-weight:700}
.li-left .ls{font-size:11px;color:var(--txt2);margin-top:1px}
.li-right{text-align:left;flex-shrink:0}
.li-day{font-size:11px;font-weight:700;color:var(--acc)}
.li-time{font-size:10px;color:var(--txt2)}
.li-room{font-size:9px;color:var(--txt3);margin-top:1px}

/* ===== SCHEDULE ===== */
.sw{display:flex;flex-direction:column;gap:12px}
.s-dh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.s-dn{font-size:11px;font-weight:700;color:var(--txt2);white-space:nowrap}
.s-dl{flex:1;height:1px;background:var(--bord)}
.s-dc{font-size:9px;background:var(--sur2);color:var(--txt3);padding:2px 6px;border-radius:8px}
.si{
  background:var(--sur);border:1px solid var(--bord);
  border-radius:var(--rsm);display:flex;align-items:center;
  gap:8px;padding:8px 11px;margin-bottom:5px;cursor:pointer;
  transition:all .15s;animation:fi .2s ease both;
}
.si:hover{border-color:var(--bord2)}
.si-time{font-size:10px;color:var(--txt2);min-width:68px;font-weight:600}
.si-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.si-info .sn{font-size:12px;font-weight:700}
.si-info .ss{font-size:10px;color:var(--txt2)}
.conflict-w{
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);
  border-radius:var(--rsm);padding:6px 10px;margin-bottom:8px;
  font-size:11px;color:#f87171;display:flex;align-items:center;gap:6px;
}
.conflict-w svg{width:12px;height:12px;stroke:#f87171;fill:none;stroke-width:2;flex-shrink:0}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:40px 20px;color:var(--txt2)}
.empty-ico{width:48px;height:48px;margin:0 auto 12px;background:var(--sur2);border-radius:14px;display:flex;align-items:center;justify-content:center}
.empty-ico svg{width:24px;height:24px;stroke:var(--txt3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty p{font-size:13px}.empty small{font-size:11px;color:var(--txt3)}

/* ===== OVERLAYS ===== */
.ov{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:300;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(5px);
}
.ov.open{display:flex;animation:fov .18s ease}
@keyframes fov{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--bg2);border-radius:22px 22px 0 0;
  width:100%;max-width:480px;padding:14px 16px 38px;
  max-height:90vh;overflow-y:auto;
  animation:su .25s cubic-bezier(.34,1.3,.64,1);
}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh{width:36px;height:4px;background:var(--bord2);border-radius:2px;margin:0 auto 16px}
.st{font-size:16px;font-weight:700;margin-bottom:15px;color:var(--txt)}

.field{margin-bottom:11px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 12px;
  background:var(--sur);border:1px solid var(--bord2);
  border-radius:var(--rsm);font-size:13px;font-family:'Cairo',sans-serif;
  color:var(--txt);outline:none;transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}
.field textarea{resize:none;height:60px}
.field select option{background:var(--bg2);color:var(--txt)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cdot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.cdot.sel{border-color:var(--txt);transform:scale(1.18)}
.mbtns{display:flex;gap:7px;margin-top:16px}
.mb{flex:1;padding:11px;border-radius:var(--rsm);font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:all .15s;border:none}
.mb-c{background:var(--sur2);color:var(--txt2)}
.mb-s{background:var(--acc);color:#fff}
.mb-d{background:rgba(239,68,68,.12);color:#f87171;flex:.55}
.mb:hover{opacity:.88}

/* ===== DETAIL ===== */
.det-top{height:5px;border-radius:3px;width:56px;margin:0 auto 12px}
.det-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.det-ico{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.det-ico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.det-name{font-size:18px;font-weight:900;color:var(--txt);line-height:1.2}
.det-dept{font-size:12px;color:var(--txt2);margin-top:2px}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.dc{background:var(--sur);border:1px solid var(--bord);border-radius:var(--rsm);padding:9px 11px}
.dcl{font-size:9px;color:var(--txt3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px}
.dcv{font-size:13px;font-weight:700;color:var(--txt)}
.det-notes{background:var(--sur);border:1px solid var(--bord);border-radius:var(--rsm);padding:10px 12px;margin-bottom:14px}
.det-nl{font-size:9px;color:var(--txt3);margin-bottom:4px}
.det-nv{font-size:12px;color:var(--txt2);line-height:1.7}
.det-acts{display:flex;gap:7px}
.da{
  flex:1;padding:11px;border-radius:var(--rsm);font-size:12px;
  font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;
  border:1px solid var(--bord2);background:var(--sur);color:var(--txt2);
  transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;
}
.da svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.da.edit{background:var(--acc);border-color:var(--acc);color:#fff}
.da.del{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.2);color:#f87171}

/* ===== SETTINGS ===== */
.theme-row{display:flex;gap:8px;margin-top:6px}
.tsw{
  flex:1;aspect-ratio:1.3;border-radius:10px;cursor:pointer;
  border:2px solid transparent;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;font-size:9px;font-weight:700;font-family:'Cairo',sans-serif;
}
.tsw.sel{border-color:var(--acc)}
.tsw-icon{font-size:18px}
.lang-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:6px}
.lo{
  padding:9px 4px;border-radius:var(--rsm);
  background:var(--sur);border:1px solid var(--bord2);
  text-align:center;cursor:pointer;transition:all .15s;
}
.lo.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.lo-flag{font-size:20px;margin-bottom:3px}
.lo-name{font-size:11px;font-weight:600}

/* ===== INSTALL BANNER ===== */
.install-banner{
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  border-radius:var(--r);padding:12px 14px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:opacity .15s;
}
.install-banner:hover{opacity:.9}
.install-banner svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ib-text .ib-t{font-size:13px;font-weight:700;color:#fff}
.ib-text .ib-s{font-size:11px;color:rgba(255,255,255,.75)}
.ib-arrow{margin-right:auto;color:#fff;font-size:16px}
</style>
</head>
<body class="th-dark">

<div style="max-width:480px;margin:0 auto">

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-row">
    <div class="app-wordmark" id="app-wordmark">موادي</div>

      </div>
      <div class="ib add-ib" onclick="playClick();openAdd()" title="add">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
    </div>
  </div>
  <div class="main-tabs">

      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <span id="t-c">المواد</span>

      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9,16 11,18 15,14"/></svg>
      <span id="t-e">الاختبارات</span>
      <span class="tab-badge" id="tc-e">0</span>
    </button>
  </div>
</div>

<div class="content" id="content"></div>
</div>

<!-- ADD/EDIT OVERLAY -->
<div class="ov" id="ov-add" onclick="ovClick(event,'ov-add')">
<div class="sheet">

// ===== AUDIO =====
let audioCtx=null;
function playClick(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='sine';o.frequency.setValueAtTime(880,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(440,audioCtx.currentTime+0.06);
    g.gain.setValueAtTime(0.08,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.08);
    o.start();o.stop(audioCtx.currentTime+0.08);
  }catch(e){}
}
function playSuccess(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    [440,554,659].forEach((f,i)=>{
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      o.connect(g);g.connect(audioCtx.destination);
      o.type='sine';o.frequency.value=f;
      const t=audioCtx.currentTime+i*0.1;
      g.gain.setValueAtTime(0.07,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      o.start(t);o.stop(t+0.15);
    });
  }catch(e){}
}

});

  if(!deferredPrompt)return;

  document.getElementById('install-btn-wrap').style.display='none';
}

};

// ===== RENDER =====
function render(){
  updateLabels();
  const list=items();
  const fil=filter==='all'?list:list.filter(c=>(c.day||c.date)===filter);
  let h='';

  // Install banner (if prompt available)
  if(deferredPrompt){
    h+=`<div class="install-banner" onclick="installApp()">

      <div class="ib-arrow">›</div>
    </div>`;
  }

  // Stats
  const ud=new Set(list.map(c=>c.day||'').filter(Boolean)).size;

  h+=`<div class="stats-row">

    <div class="stat"><div class="stat-num">${ude||'—'}</div><div class="stat-lbl">${t('depts')}</div></div>

  // View switcher
  h+=`<div class="vsw">
    <button class="vbtn${view==='grid'?' active':''}" onclick="playClick();setView('grid')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>${t('grid')}</button>
    <button class="vbtn${view==='list'?' active':''}" onclick="playClick();setView('list')"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>${t('list')}</button>

  </div>`;

  // Day filter
  const days=getDays();
  h+=`<div class="day-scroll"><button class="dchip${filter==='all'?' active':''}" onclick="playClick();setFilter('all')">${t('all')}</button>${DAR.map((d,i)=>`<button class="dchip${filter===d?' active':''}" onclick="playClick();setFilter('${d}')">${days[i]}</button>`).join('')}</div>`;

  // Size toggle
  if(view==='grid'){
    h+=`<div class="size-row"><span class="size-lbl">${t('size')}</span><div class="size-pills"><button class="spill${sz==='sm'?' active':''}" onclick="playClick();setSz('sm')">${t('small')}</button><button class="spill${sz==='md'?' active':''}" onclick="playClick();setSz('md')">${t('medium')}</button><button class="spill${sz==='lg'?' active':''}" onclick="playClick();setSz('lg')">${t('large')}</button></div></div>`;
  }

  if(!fil.length){
    h+=`<div class="empty"><div class="empty-ico"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/></svg></div><p>${t('empty')}</p><small>${t('emptySub')}</small></div>`;

    h+=`<div class="grid ${sz}">${fil.map((c,i)=>cardH(c,i)).join('')}</div>`;

  } else {

  }

function cardH(c,i){
  const col=COLS[c.ci||0];
  const bc=sz==='sm'?'sm':sz==='lg'?'lg':'';
  const isE=c.type==='exam';
  const ts=isE?`${c.date||''} ${c.et||''}`:`${c.s||''}–${c.e||''}`;
  const sub=isE?c.room:(c.doc||'');
  const dl=isE?'':dLabel(c.day||'');
  return`<div class="cc${isE?' exam':''}" onclick="playClick();openDet(${c.id})" style="animation-delay:${i*.04}s">
    <div class="cc-bar" style="background:${col.b}"></div>
    <div class="cc-body ${bc}">
      <div class="cc-name">${c.name}</div>
      <div class="cc-sub">${sub}</div>
      <div class="cc-tags">${c.dept?`<span class="cc-tag" style="background:${col.bg};color:${col.tx}">${c.dept}</span>`:''}${dl?`<span class="cc-tag" style="background:var(--sur3);color:var(--txt2)">${dl}</span>`:''}</div>
      <div class="cc-time"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>${ts}</div>
    </div></div>`;
}

function listH(c,i){
  const col=COLS[c.ci||0];
  const isE=c.type==='exam';
  const ts=isE?c.et:`${c.s||''}–${c.e||''}`;
  const dl=isE?(c.date||''):dLabel(c.day||'');
  return`<div class="li" onclick="playClick();openDet(${c.id})" style="animation-delay:${i*.04}s">
    <div class="li-stripe" style="background:${col.b}"></div>
    <div class="li-body">
      <div class="li-left"><div class="ln">${c.name}</div><div class="ls">${[c.doc,c.dept].filter(Boolean).join(' · ')}</div></div>
      <div class="li-right"><div class="li-day">${dl}</div><div class="li-time">${ts}</div>${c.room?`<div class="li-room">${c.room}</div>`:''}</div>
    </div></div>`;
}

function schedH(fil){
  const byDay={};DAR.forEach(d=>{byDay[d]=[]});
  fil.forEach(c=>{const d=c.day||DAR[0];if(byDay[d])byDay[d].push(c)});
  const active=DAR.filter(d=>byDay[d].length>0&&(filter==='all'||filter===d));
  if(!active.length)return'';
  let h='<div class="sw">';
  active.forEach(day=>{
    const dc=byDay[day].sort((a,b)=>(a.s||'').localeCompare(b.s||''));
    const conf=new Set();
    for(let a=0;a<dc.length;a++)for(let b=a+1;b<dc.length;b++){
      if((dc[a].s||'')<(dc[b].e||'')&&(dc[a].e||'')>(dc[b].s||'')){conf.add(dc[a].id);conf.add(dc[b].id)}
    }
    h+=`<div><div class="s-dh"><span class="s-dn">${dLabel(day)}</span><div class="s-dl"></div><span class="s-dc">${dc.length}</span></div>`;
    if(conf.size)h+=`<div class="conflict-w"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>${t('conflict')}</div>`;
    dc.forEach(c=>{
      const col=COLS[c.ci||0];
      h+=`<div class="si" onclick="playClick();openDet(${c.id})">
        <div class="si-time">${c.s||''}–${c.e||''}</div>
        <div class="si-dot" style="background:${col.b}"></div>
        <div class="si-info"><div class="sn">${c.name}</div><div class="ss">${[c.room,c.doc].filter(Boolean).join(' · ')}</div></div>
        ${conf.has(c.id)?`<span style="font-size:12px;color:#f87171">⚠</span>`:''}
      </div>`;
    });
    h+='</div>';
  });
  return h+'</div>';
}

// ===== DETAIL =====
function findItem(id){return[...courses,...exams].find(c=>c.id===id)}
function openDet(id){
  const c=findItem(id);if(!c)return;

  const icon=isE?`<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9,16 11,18 15,14"/></svg>`:`<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="13" y2="11"/></svg>`;
  const rows=isE?[
    {l:t('date'),v:c.date||'—'},{l:t('time'),v:c.et||'—'},
    {l:t('room'),v:c.room||'—'},{l:t('dept'),v:c.dept||'—'},
  ]:[
    {l:t('day'),v:dLabel(c.day||'')},{l:`${t('start')}–${t('end')}`,v:`${c.s||''}–${c.e||''}`},
    {l:t('room'),v:c.room||'—'},{l:t('doctor'),v:c.doc||'—'},
  ];
  document.getElementById('det-body').innerHTML=`
    <div class="det-top" style="background:${col.b}"></div>

      <div class="det-ico" style="background:${col.b}">${icon}</div>

    </div>
    <div class="det-grid">${rows.map(r=>`<div class="dc"><div class="dcl">${r.l}</div><div class="dcv">${r.v}</div></div>`).join('')}</div>
    ${c.notes?`<div class="det-notes"><div class="det-nl">${t('notes')}</div><div class="det-nv">${c.notes}</div></div>`:''}
    <div class="det-acts">
      <button class="da del" onclick="playClick();closeDet();setTimeout(()=>{openEdit(${c.id});setTimeout(()=>delItem(),50)},100)">
        <svg viewBox="0 0 24 24"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/><path d="M10,11v6"/><path d="M14,11v6"/></svg>${t('del')}
      </button>
      <button class="da edit" onclick="playClick();closeDet();openEdit(${c.id})">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>${t('edit')}
      </button>
    </div>`;
  document.getElementById('ov-det').classList.add('open');
}
function closeDet(){document.getElementById('ov-det').classList.remove('open')}

// ===== ADD/EDIT =====
function buildDaySelect(){
  const s=document.getElementById('f-day');
  if(!s)return;
  const cur=s.value;
  const days=getDays();
  s.innerHTML=DAR.map((d,i)=>`<option value="${d}"${d===cur?' selected':''}>${days[i]}</option>`).join('');
}
function openAdd(){
  addType=tab==='exams'?'exam':'course';eid=null;
  document.getElementById('eid').value='';
  document.getElementById('add-title').textContent=addType==='exam'?t('addExam'):t('addCourse');
  document.getElementById('cf').style.display=addType==='course'?'':'none';
  document.getElementById('ef').style.display=addType==='exam'?'':'none';
  document.getElementById('del-btn').style.display='none';
  clearForm();buildColorRow(0);buildDaySelect();
  document.getElementById('ov-add').classList.add('open');
}
function openEdit(id){
  const c=findItem(id);if(!c)return;
  addType=c.type;eid=id;
  document.getElementById('eid').value=id;
  document.getElementById('add-title').textContent=c.type==='exam'?t('editExam'):t('editCourse');
  document.getElementById('cf').style.display=c.type==='course'?'':'none';
  document.getElementById('ef').style.display=c.type==='exam'?'':'none';
  document.getElementById('del-btn').style.display='inline-flex';
  document.getElementById('f-name').value=c.name||'';
  document.getElementById('f-notes').value=c.notes||'';
  if(c.type==='course'){
    document.getElementById('f-doc').value=c.doc||'';
    document.getElementById('f-dept').value=c.dept||'';
    document.getElementById('f-room').value=c.room||'';
    document.getElementById('f-s').value=c.s||'08:00';
    document.getElementById('f-e').value=c.e||'10:00';
    buildDaySelect();document.getElementById('f-day').value=c.day||DAR[0];
  } else {
    document.getElementById('f-dt').value=c.date||'';
    document.getElementById('f-et').value=c.et||'09:00';
    document.getElementById('f-room2').value=c.room||'';
  }
  buildColorRow(c.ci||0);
  document.getElementById('ov-add').classList.add('open');
}
function clearForm(){
  ['f-name','f-doc','f-dept','f-room','f-room2','f-notes'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
  document.getElementById('f-s').value='08:00';document.getElementById('f-e').value='10:00';
  document.getElementById('f-dt').value=new Date().toISOString().split('T')[0];
  document.getElementById('f-et').value='09:00';
}
function buildColorRow(sel){
  selC=sel;
  document.getElementById('crow').innerHTML=COLS.map((c,i)=>`<div class="cdot${i===sel?' sel':''}" style="background:${c.b}" onclick="pickC(${i})"></div>`).join('');
}
function pickC(i){selC=i;buildColorRow(i)}
function saveItem(){
  const name=document.getElementById('f-name').value.trim();
  if(!name)return;
  if(eid!==null){
    const arr=addType==='course'?courses:exams;
    const idx=arr.findIndex(c=>c.id===eid);
    if(idx>=0){
      if(addType==='course')arr[idx]={...arr[idx],name,doc:document.getElementById('f-doc').value.trim(),dept:document.getElementById('f-dept').value.trim(),day:document.getElementById('f-day').value,s:document.getElementById('f-s').value,e:document.getElementById('f-e').value,room:document.getElementById('f-room').value.trim(),notes:document.getElementById('f-notes').value.trim(),ci:selC};
      else arr[idx]={...arr[idx],name,date:document.getElementById('f-dt').value,et:document.getElementById('f-et').value,room:document.getElementById('f-room2').value.trim(),notes:document.getElementById('f-notes').value.trim(),ci:selC};
    }
  } else {
    if(addType==='course')courses.push({id:nid++,type:'course',name,doc:document.getElementById('f-doc').value.trim(),dept:document.getElementById('f-dept').value.trim(),day:document.getElementById('f-day').value,s:document.getElementById('f-s').value,e:document.getElementById('f-e').value,room:document.getElementById('f-room').value.trim(),notes:document.getElementById('f-notes').value.trim(),ci:selC});
    else exams.push({id:nid++,type:'exam',name,dept:'',date:document.getElementById('f-dt').value,et:document.getElementById('f-et').value,room:document.getElementById('f-room2').value.trim(),notes:document.getElementById('f-notes').value.trim(),ci:selC});
  }
  playSuccess();closeAdd();render();
}
function delItem(){
  if(!confirm(lang==='ar'?'حذف؟':lang==='tr'?'Sil?':'Delete?'))return;
  courses=courses.filter(c=>c.id!==eid);exams=exams.filter(c=>c.id!==eid);
  closeAdd();render();
}
function closeAdd(){document.getElementById('ov-add').classList.remove('open')}

// ===== SETTINGS =====
function openSettings(){document.getElementById('ov-set').classList.add('open')}
function closeSettings(){document.getElementById('ov-set').classList.remove('open')}
function setTheme(cls,el){
  document.body.className=cls;
  document.querySelectorAll('.tsw').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('meta-theme').content=getComputedStyle(document.body).getPropertyValue('--bg').trim();
}
function setLang(l,el){
  lang=l;
  document.querySelectorAll('.lo').forEach(s=>s.classList.remove('sel'));el.classList.add('sel');
  document.documentElement.dir=l==='ar'?'rtl':'ltr';document.documentElement.lang=l;
  buildDaySelect();updateLabels();render();
}
function updateLabels(){
  document.getElementById('app-wordmark').textContent=lang==='en'?'Mawadi':lang==='tr'?'Derslerim':'موادي';
  document.getElementById('t-c').textContent=t('courses');
  document.getElementById('t-e').textContent=t('exams');
  document.getElementById('tc-c').textContent=courses.length;
  document.getElementById('tc-e').textContent=exams.length;
  document.getElementById('s-title').textContent=t('settings');
  document.getElementById('s-tl').textContent=t('theme');
  document.getElementById('s-ll').textContent=t('lang');
  document.getElementById('s-done').textContent=t('done');
  // install hint label
  const sil=document.getElementById('s-il');if(sil)sil.textContent=t('install');
  // update add modal labels if open
  ['l-name','l-doc','l-dept','l-day','l-room','l-s','l-e','l-dt','l-et','l-room2','l-notes','l-color'].forEach((id,i)=>{
    const keys=['name','doctor','dept','day','room','start','end','date','time','room','notes','color'];
    const el=document.getElementById(id);if(el)el.textContent=t(keys[i]||'');
  });
  const bc=document.getElementById('btn-cancel');if(bc)bc.textContent=t('cancel');
  const bs=document.getElementById('btn-save');if(bs)bs.textContent=t('save');
  const db=document.getElementById('del-btn');if(db)db.textContent=t('del');
}
// ===== MISC =====
function setView(v){view=v;render()}
function setFilter(f){filter=f;render()}
function setSz(s){sz=s;render()}
function switchTab(t2){tab=t2;filter='all';document.getElementById('tab-c').classList.toggle('active',t2==='courses');document.getElementById('tab-e').classList.toggle('active',t2==='exams');render()}
function ovClick(e,id){if(e.target===document.getElementById(id))document.getElementById(id).classList.remove('open')}

render();
</script>
</body>
</html>
