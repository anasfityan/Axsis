<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="موادي">
<meta name="theme-color" content="#1a1a2e">
<title>موادي — University Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f1a;
  --bg2:#16162a;
  --bg3:#1e1e35;
  --surface:#1e1e35;
  --surface2:#252540;
  --surface3:#2e2e50;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.14);
  --text:#f0f0ff;
  --text2:#9898c0;
  --text3:#5a5a80;
  --accent:#6c63ff;
  --accent2:#a78bfa;
  --exam:#f59e0b;
  --exam2:#fcd34d;
  --success:#10b981;
  --danger:#ef4444;
  --r:14px;
  --r-sm:8px;
  --r-lg:20px;
}
.theme-light{
  --bg:#f0eff8;
  --bg2:#e8e7f5;
  --bg3:#ffffff;
  --surface:#ffffff;
  --surface2:#f0eff8;
  --surface3:#e4e3f5;
  --border:rgba(0,0,0,0.07);
  --border2:rgba(0,0,0,0.14);
  --text:#1a1a2e;
  --text2:#5a5a80;
  --text3:#9898c0;
  --accent:#6c63ff;
  --accent2:#7c6fef;
}
.theme-midnight{
  --bg:#0a0a12;
  --bg2:#111120;
  --bg3:#18182e;
  --surface:#18182e;
  --surface2:#1f1f38;
  --surface3:#282845;
  --border:rgba(255,255,255,0.06);
  --border2:rgba(255,255,255,0.12);
  --text:#e8e8ff;
  --text2:#7878a8;
  --accent:#818cf8;
  --accent2:#a5b4fc;
}
.theme-forest{
  --bg:#0d1a0f;
  --bg2:#121f14;
  --bg3:#182a1a;
  --surface:#182a1a;
  --surface2:#1f3322;
  --surface3:#253d28;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --text:#e8f5e8;
  --text2:#7aaa7a;
  --accent:#4ade80;
  --accent2:#86efac;
}
.theme-rose{
  --bg:#1a0d14;
  --bg2:#221218;
  --bg3:#2e1820;
  --surface:#2e1820;
  --surface2:#381e28;
  --surface3:#422430;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --text:#ffe8f0;
  --text2:#c07090;
  --accent:#f472b6;
  --accent2:#f9a8d4;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  font-family:'Cairo',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  transition:background 0.3s,color 0.3s;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* APP SHELL */
.app-shell{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto}

/* TOP BAR */
.topbar{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(12px);
}
.app-logo{
  display:flex;align-items:center;gap:10px;
}
.logo-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.logo-icon svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2}
.logo-text{font-size:18px;font-weight:900;color:var(--text);letter-spacing:-0.5px}
.logo-text span{color:var(--accent)}
.topbar-actions{display:flex;align-items:center;gap:6px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.15s;
  color:var(--text2);position:relative;
}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:var(--surface3);color:var(--text)}
.add-fab-btn{
  width:36px;height:36px;border-radius:10px;
  background:var(--accent);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.15s;color:#fff;
}
.add-fab-btn svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round}
.add-fab-btn:hover{opacity:0.88;transform:scale(1.05)}

/* TABS (courses/exams) */
.main-tabs{
  display:flex;padding:12px 16px 0;gap:8px;
  background:var(--bg2);border-bottom:1px solid var(--border);
}
.main-tab{
  padding:8px 18px;border-radius:var(--r-sm) var(--r-sm) 0 0;
  font-size:13px;font-weight:600;font-family:'Cairo',sans-serif;
  background:transparent;border:1px solid transparent;
  border-bottom:none;color:var(--text2);cursor:pointer;
  display:flex;align-items:center;gap:6px;
  transition:all 0.15s;
}
.main-tab.active{
  background:var(--bg);color:var(--accent);
  border-color:var(--border);border-bottom:2px solid var(--accent);
}
.main-tab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab-count{
  background:var(--surface3);color:var(--text2);
  font-size:10px;padding:1px 6px;border-radius:10px;
}
.main-tab.active .tab-count{background:var(--accent);color:#fff}

/* CONTENT */
.content{flex:1;padding:14px 14px 100px}

/* VIEW SWITCHER */
.view-switcher{
  display:flex;gap:0;margin-bottom:12px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:3px;overflow:hidden;
}
.view-btn{
  flex:1;padding:7px 0;border:none;background:transparent;
  font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;
  color:var(--text2);cursor:pointer;border-radius:6px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:all 0.15s;
}
.view-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.view-btn.active{background:var(--accent);color:#fff}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 12px;text-align:center;
}
.stat-num{font-size:22px;font-weight:900;color:var(--accent)}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:1px;line-height:1.3}

/* DAY FILTER */
.day-scroll{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;
  scrollbar-width:none;
}
.day-scroll::-webkit-scrollbar{display:none}
.day-chip{
  flex-shrink:0;padding:5px 13px;border-radius:20px;
  background:var(--surface);border:1px solid var(--border);
  font-size:12px;font-weight:600;font-family:'Cairo',sans-serif;
  color:var(--text2);cursor:pointer;transition:all 0.15s;
}
.day-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* SIZE TOGGLE */
.size-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.size-lbl{font-size:12px;color:var(--text3)}
.size-pills{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px}
.size-pill{
  padding:4px 10px;border-radius:5px;border:none;background:transparent;
  font-size:11px;font-weight:600;font-family:'Cairo',sans-serif;
  color:var(--text2);cursor:pointer;transition:all 0.15s;
}
.size-pill.active{background:var(--accent);color:#fff}

/* GRID */
.grid{display:grid;gap:10px}
.grid.sm{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.md{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.lg{grid-template-columns:1fr}

/* COURSE CARD */
.c-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s;
  animation:fadeIn 0.25s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.c-card:hover{transform:translateY(-2px);border-color:var(--border2)}
.c-card:active{transform:scale(0.97)}
.c-top{height:5px;width:100%}
.c-body{padding:11px 12px}
.c-body.sm{padding:8px 9px}
.c-body.lg{padding:14px 16px}
.c-name{font-weight:700;color:var(--text);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.sm .c-name{font-size:11px}
.grid.md .c-name{font-size:13px}
.grid.lg .c-name{font-size:15px}
.c-sub{font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.sm .c-sub{display:none}
.c-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.grid.sm .c-tags{display:none}
.c-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
.c-time{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:11px;color:var(--text2)}
.c-time svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.grid.sm .c-time{margin-top:4px;font-size:10px}
.grid.sm .c-time svg{display:none}

/* EXAM CARD special */
.c-card.exam .c-top{background:linear-gradient(90deg,var(--exam),var(--exam2))!important}
.c-card.exam .c-name{color:var(--text)}

/* LIST VIEW */
.list-wrap{display:flex;flex-direction:column;gap:8px}
.l-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);display:flex;align-items:stretch;
  overflow:hidden;cursor:pointer;transition:all 0.15s;
  animation:fadeIn 0.2s ease both;
}
.l-item:hover{border-color:var(--border2)}
.l-stripe{width:4px;flex-shrink:0}
.l-body{flex:1;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.l-left .ln{font-size:14px;font-weight:700}
.l-left .ls{font-size:12px;color:var(--text2);margin-top:2px}
.l-right{text-align:left;flex-shrink:0}
.l-day{font-size:12px;font-weight:700;color:var(--accent)}
.l-time{font-size:11px;color:var(--text2)}
.l-room{font-size:10px;color:var(--text3);margin-top:1px}

/* SCHEDULE VIEW */
.sched-wrap{display:flex;flex-direction:column;gap:14px}
.s-day-block{}
.s-day-header{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.s-day-name{font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap}
.s-day-line{flex:1;height:1px;background:var(--border)}
.s-day-count{font-size:10px;background:var(--surface2);color:var(--text3);padding:2px 7px;border-radius:10px}
.s-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);display:flex;align-items:center;
  gap:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;
  transition:all 0.15s;animation:fadeIn 0.2s ease both;
}
.s-item:hover{border-color:var(--border2)}
.s-time{font-size:11px;color:var(--text2);min-width:75px;font-weight:600}
.s-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.s-info .sn{font-size:13px;font-weight:700}
.s-info .ss{font-size:11px;color:var(--text2)}
.s-conflict{
  font-size:10px;background:rgba(239,68,68,0.15);color:#f87171;
  padding:2px 7px;border-radius:6px;margin-right:auto;
}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--text2)}
.empty-icon{width:56px;height:56px;margin:0 auto 14px;background:var(--surface2);border-radius:16px;display:flex;align-items:center;justify-content:center}
.empty-icon svg{width:28px;height:28px;stroke:var(--text3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty p{font-size:14px;line-height:1.6}
.empty small{font-size:12px;color:var(--text3)}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;justify-content:center;gap:0;padding:8px 12px 20px;
  z-index:100;backdrop-filter:blur(12px);
}

/* ===== MODALS ===== */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:300;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(4px);
}
.overlay.open{display:flex;animation:fadeOverlay 0.2s ease}
@keyframes fadeOverlay{from{opacity:0}to{opacity:1}}

.sheet{
  background:var(--bg2);border-radius:24px 24px 0 0;
  width:100%;max-width:480px;padding:16px 18px 40px;
  max-height:92vh;overflow-y:auto;
  animation:slideUp 0.28s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:38px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:18px;color:var(--text)}

.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 13px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--r-sm);font-size:14px;font-family:'Cairo',sans-serif;
  color:var(--text);outline:none;transition:border-color 0.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:none;height:72px}
.field select option{background:var(--bg2);color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.color-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.cdot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.15s,border-color 0.15s}
.cdot.sel{border-color:var(--text);transform:scale(1.2)}

.modal-btns{display:flex;gap:8px;margin-top:18px}
.mbtn{
  flex:1;padding:12px;border-radius:var(--r-sm);
  font-size:14px;font-weight:700;font-family:'Cairo',sans-serif;
  cursor:pointer;transition:all 0.15s;border:none;
}
.mbtn-cancel{background:var(--surface2);color:var(--text2)}
.mbtn-save{background:var(--accent);color:#fff}
.mbtn-del{background:rgba(239,68,68,0.15);color:#f87171;flex:0.6}
.mbtn:hover{opacity:0.88}

/* DETAIL SHEET */
.detail-top{height:6px;border-radius:3px;width:60px;margin:0 auto 14px}
.detail-icon-row{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.detail-icon{
  width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.detail-icon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.detail-name{font-size:20px;font-weight:900;color:var(--text);line-height:1.2}
.detail-dept{font-size:13px;color:var(--text2);margin-top:3px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.d-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px}
.d-cell-lbl{font-size:10px;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px}
.d-cell-val{font-size:14px;font-weight:700;color:var(--text)}
.detail-notes{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:18px}
.detail-notes-lbl{font-size:10px;color:var(--text3);margin-bottom:5px}
.detail-notes-val{font-size:13px;color:var(--text2);line-height:1.7}
.detail-actions{display:flex;gap:8px}
.d-btn{
  flex:1;padding:12px;border-radius:var(--r-sm);font-size:13px;
  font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;
  border:1px solid var(--border2);background:var(--surface);color:var(--text2);
  transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.d-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.d-btn.edit{background:var(--accent);border-color:var(--accent);color:#fff}
.d-btn.del{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.25);color:#f87171}

/* THEME PICKER */
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.theme-swatch{
  aspect-ratio:1;border-radius:10px;cursor:pointer;
  border:2px solid transparent;transition:all 0.15s;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.theme-swatch.sel{border-color:var(--text);transform:scale(1.1)}

/* LANG PICKER */
.lang-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.lang-opt{
  padding:10px 6px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border2);
  text-align:center;cursor:pointer;transition:all 0.15s;
}
.lang-opt.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.lang-flag{font-size:22px;margin-bottom:4px}
.lang-name{font-size:12px;font-weight:600}

/* CONFLICT BADGE */
.conflict-warn{
  background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);
  border-radius:var(--r-sm);padding:8px 12px;margin-bottom:10px;
  font-size:12px;color:#f87171;display:flex;align-items:center;gap:8px;
}
.conflict-warn svg{width:14px;height:14px;stroke:#f87171;fill:none;stroke-width:2;flex-shrink:0}
</style>
</head>

<script>
// ===== DATA =====
const COLORS=[
  {bar:'#6c63ff',bg:'rgba(108,99,255,0.15)',text:'#a78bfa'},
  {bar:'#10b981',bg:'rgba(16,185,129,0.15)',text:'#6ee7b7'},

  {bar:'#ec4899',bg:'rgba(236,72,153,0.15)',text:'#f9a8d4'},
  {bar:'#14b8a6',bg:'rgba(20,184,166,0.15)',text:'#99f6e4'},

const DAYS_AR=['الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const DAYS_EN=['Monday','Tuesday','Wednesday','Thursday','Friday'];

const I18N={
  ar:{

    cancel:'إلغاء',save:'حفظ',del:'حذف',edit:'تعديل',
    all:'الكل',settings:'الإعدادات',theme:'الثيم',lang:'اللغة',done:'تم',
    grid:'مربعات',list:'قائمة',schedule:'جدول',
    small:'صغير',medium:'متوسط',large:'كبير',cardSize:'حجم البطاقات',

    noItems:'لا توجد عناصر',noItemsSub:'اضغط + لإضافة',

  },
  en:{
    appTitle:'Mawadi',courses:'Courses',exams:'Exams',
    addCourse:'Add Course',addExam:'Add Exam',
    editCourse:'Edit Course',editExam:'Edit Exam',
    name:'Name',doctor:'Instructor',dept:'Department',day:'Day',

    cancel:'Cancel',save:'Save',del:'Delete',edit:'Edit',

    grid:'Grid',list:'List',schedule:'Schedule',
    small:'Small',medium:'Medium',large:'Large',cardSize:'Card Size',
    totalCourses:'courses',days:'days',dept2:'depts',

  tr:{

    addCourse:'Ders Ekle',addExam:'Sınav Ekle',
    editCourse:'Dersi Düzenle',editExam:'Sınavı Düzenle',
    name:'Ad',doctor:'Öğretim Üyesi',dept:'Bölüm',day:'Gün',
    room:'Derslik',startT:'Başlangıç',endT:'Bitiş',
    date:'Tarih',time:'Saat',notes:'Notlar',color:'Renk',
    cancel:'İptal',save:'Kaydet',del:'Sil',edit:'Düzenle',
    all:'Tümü',settings:'Ayarlar',theme:'Tema',lang:'Dil',done:'Tamam',
    grid:'Izgara',list:'Liste',schedule:'Takvim',
    small:'Küçük',medium:'Orta',large:'Büyük',cardSize:'Kart Boyutu',
    totalCourses:'ders',days:'gün',dept2:'bölüm',
    noItems:'Henüz öğe yok',noItemsSub:'Eklemek için + tıkla',
    conflict:'Çakışma',
    monday:'Pazartesi',tuesday:'Salı',wednesday:'Çarşamba',thursday:'Perşembe',friday:'Cuma',
  }
};

let lang='ar';
let currentTab='courses';
let view='grid';
let filter='all';
let cardSize='md';
let currentTheme='theme-dark';
let editingId=null;
let addingType='course';

let courses=[
  {id:1,type:'course',name:'رياضيات 2',doctor:'د. محمد علي',dept:'علوم حاسوب',day:'الاثنين',start:'08:00',end:'10:00',room:'A101',notes:'',ci:0},
  {id:2,type:'course',name:'برمجة متقدمة',doctor:'د. سارة خالد',dept:'علوم حاسوب',day:'الثلاثاء',start:'10:00',end:'12:00',room:'B204',notes:'',ci:1},
  {id:3,type:'course',name:'قواعد بيانات',doctor:'د. أحمد سالم',dept:'علوم حاسوب',day:'الأربعاء',start:'12:00',end:'14:00',room:'C305',notes:'',ci:2},
  {id:4,type:'course',name:'شبكات حاسوب',doctor:'د. فيصل العمري',dept:'هندسة',day:'الاثنين',start:'10:00',end:'12:00',room:'A202',notes:'',ci:3},
];
let exams=[
  {id:10,type:'exam',name:'اختبار رياضيات',doctor:'',dept:'',date:'2025-06-10',etime:'09:00',room:'A101',notes:'الفصول 1-5',ci:2},
];
let nid=20;

function t(k){return I18N[lang][k]||k}
function getDays(){return lang==='en'?DAYS_EN:lang==='tr'?DAYS_TR:DAYS_AR}
function dayLabel(d){
  const idx=DAYS_AR.indexOf(d);
  if(idx<0)return d;
  return getDays()[idx];
}

function items(){return currentTab==='courses'?courses:exams}

// ===== RENDER =====
function render(){
  updateI18N();
  renderStats();
  renderContent();
}

function updateI18N(){
  document.getElementById('app-title').innerHTML=lang==='ar'?'مواد<span>ي</span>':t('appTitle');
  document.getElementById('t-courses').textContent=t('courses');
  document.getElementById('t-exams').textContent=t('exams');
  document.getElementById('tc-courses').textContent=courses.length;
  document.getElementById('tc-exams').textContent=exams.length;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.documentElement.lang=lang;
}

function renderStats(){
  const list=items();
  const uniqDays=new Set(list.map(c=>c.day||c.date)).size;
  const uniqDepts=new Set(list.map(c=>c.dept).filter(Boolean)).size;
  const s=document.getElementById('main-content');
  // stats injected in renderContent
}

function getFilteredItems(){
  const list=items();
  if(filter==='all')return list;
  return list.filter(c=>(c.day===filter)||(c.date&&c.date===filter));
}

function detectConflicts(day,start,end,excludeId){
  return courses.filter(c=>
    c.day===day && c.id!==excludeId &&
    c.start<end && c.end>start
  );
}

function renderContent(){
  const list=items();
  const filtered=getFilteredItems();
  const content=document.getElementById('main-content');

  let html='';

  // Stats
  const uniqDays=new Set(list.map(c=>c.day||'').filter(Boolean)).size;
  const uniqDepts=new Set(list.map(c=>c.dept||'').filter(Boolean)).size;
  html+=`<div class="stats-row">
    <div class="stat"><div class="stat-num">${list.length}</div><div class="stat-lbl">${t('totalCourses')}</div></div>
    <div class="stat"><div class="stat-num">${uniqDays}</div><div class="stat-lbl">${t('days')}</div></div>
    <div class="stat"><div class="stat-num">${uniqDepts||'—'}</div><div class="stat-lbl">${t('dept2')}</div></div>
  </div>`;

  // View switcher
  html+=`<div class="view-switcher">
    <button class="view-btn${view==='grid'?' active':''}" onclick="setView('grid')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>${t('grid')}
    </button>
    <button class="view-btn${view==='list'?' active':''}" onclick="setView('list')">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>${t('list')}
    </button>
    <button class="view-btn${view==='schedule'?' active':''}" onclick="setView('schedule')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${t('schedule')}
    </button>
  </div>`;

  // Day filter
  const days=getDays();
  html+=`<div class="day-scroll">
    <button class="day-chip${filter==='all'?' active':''}" onclick="setFilter('all')">${t('all')}</button>
    ${DAYS_AR.map((d,i)=>`<button class="day-chip${filter===d?' active':''}" onclick="setFilter('${d}')">${days[i]}</button>`).join('')}
  </div>`;

  // Size toggle (grid only)
  if(view==='grid'){
    html+=`<div class="size-row">
      <span class="size-lbl">${t('cardSize')}</span>
      <div class="size-pills">
        <button class="size-pill${cardSize==='sm'?' active':''}" onclick="setCardSize('sm')">${t('small')}</button>
        <button class="size-pill${cardSize==='md'?' active':''}" onclick="setCardSize('md')">${t('medium')}</button>
        <button class="size-pill${cardSize==='lg'?' active':''}" onclick="setCardSize('lg')">${t('large')}</button>
      </div>
    </div>`;
  }

  // Empty state
  if(!filtered.length){
    html+=`<div class="empty">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/></svg>
      </div>
      <p>${t('noItems')}</p>
      <small>${t('noItemsSub')}</small>
    </div>`;
  } else if(view==='grid'){
    html+=`<div class="grid ${cardSize}">${filtered.map((c,i)=>cardHTML(c,i)).join('')}</div>`;
  } else if(view==='list'){
    html+=`<div class="list-wrap">${filtered.map((c,i)=>listHTML(c,i)).join('')}</div>`;
  } else {
    html+=scheduleHTML(filtered);
  }

  content.innerHTML=html;
}

function cardHTML(c,i){
  const col=COLORS[c.ci||0];
  const bodyClass=cardSize==='sm'?'sm':cardSize==='lg'?'lg':'';
  const isExam=c.type==='exam';
  const timeStr=isExam?`${c.date||''} ${c.etime||''}`:`${c.start||''}–${c.end||''}`;
  const subInfo=isExam?c.room:(c.doctor||'');
  const dayStr=isExam?'':dayLabel(c.day);
  return `<div class="c-card${isExam?' exam':''}" onclick="openDetail(${c.id})" style="animation-delay:${i*0.04}s">
    <div class="c-top" style="background:${col.bar}"></div>
    <div class="c-body ${bodyClass}">
      <div class="c-name" title="${c.name}">${c.name}</div>
      <div class="c-sub">${subInfo}</div>
      <div class="c-tags">
        ${c.dept?`<span class="c-tag" style="background:${col.bg};color:${col.text}">${c.dept}</span>`:''}
        ${dayStr?`<span class="c-tag" style="background:var(--surface3);color:var(--text2)">${dayStr}</span>`:''}
      </div>
      <div class="c-time">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
        ${timeStr}
      </div>
    </div>
  </div>`;
}

function listHTML(c,i){
  const col=COLORS[c.ci||0];
  const isExam=c.type==='exam';
  const timeStr=isExam?`${c.etime||''}`:`${c.start||''}–${c.end||''}`;
  const dayStr=isExam?(c.date||''):dayLabel(c.day||'');
  return `<div class="l-item" onclick="openDetail(${c.id})" style="animation-delay:${i*0.04}s">
    <div class="l-stripe" style="background:${col.bar}"></div>
    <div class="l-body">
      <div class="l-left">
        <div class="ln">${c.name}</div>
        <div class="ls">${[c.doctor,c.dept].filter(Boolean).join(' · ')}</div>
      </div>
      <div class="l-right">
        <div class="l-day">${dayStr}</div>
        <div class="l-time">${timeStr}</div>
        ${c.room?`<div class="l-room">${c.room}</div>`:''}
      </div>
    </div>
  </div>`;
}

function scheduleHTML(filtered){
  // Group by day, sort by time, detect conflicts
  const byDay={};
  DAYS_AR.forEach(d=>{byDay[d]=[]});
  filtered.forEach(c=>{
    const d=c.day||'الاثنين';
    if(!byDay[d])byDay[d]=[];
    byDay[d].push(c);
  });

  const activeDays=DAYS_AR.filter(d=>byDay[d].length>0&&(filter==='all'||filter===d));
  if(!activeDays.length)return'<div class="empty"><p>—</p></div>';

  let html='<div class="sched-wrap">';
  activeDays.forEach(day=>{
    const dc=byDay[day].sort((a,b)=>(a.start||'').localeCompare(b.start||''));
    const count=dc.length;
    html+=`<div class="s-day-block">
      <div class="s-day-header">
        <span class="s-day-name">${dayLabel(day)}</span>
        <div class="s-day-line"></div>
        <span class="s-day-count">${count}</span>
      </div>`;

    // detect conflicts
    const conflicts=new Set();
    for(let a=0;a<dc.length;a++)for(let b=a+1;b<dc.length;b++){
      if(dc[a].start<dc[b].end&&dc[a].end>dc[b].start){conflicts.add(dc[a].id);conflicts.add(dc[b].id)}
    }

    if(conflicts.size>0){
      html+=`<div class="conflict-warn">
        <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        ${t('conflict')}
      </div>`;
    }

    dc.forEach(c=>{
      const col=COLORS[c.ci||0];
      const timeStr=`${c.start||''}–${c.end||''}`;
      html+=`<div class="s-item" onclick="openDetail(${c.id})">
        <div class="s-time">${timeStr}</div>
        <div class="s-dot" style="background:${col.bar}"></div>
        <div class="s-info">
          <div class="sn">${c.name}</div>
          <div class="ss">${[c.room?`${c.room}`:'',(c.doctor||'')].filter(Boolean).join(' · ')}</div>
        </div>
        ${conflicts.has(c.id)?`<span class="s-conflict">⚠</span>`:''}
      </div>`;
    });
    html+='</div>';
  });
  html+='</div>';
  return html;
}

// ===== ACTIONS =====
function setView(v){view=v;render()}
function setFilter(f){filter=f;render()}
function setCardSize(s){cardSize=s;render()}
function switchTab(tab){
  currentTab=tab;
  filter='all';
  document.getElementById('tab-courses').classList.toggle('active',tab==='courses');
  document.getElementById('tab-exams').classList.toggle('active',tab==='exams');
  render();
}

// ===== DETAIL =====
function findItem(id){return [...courses,...exams].find(c=>c.id===id)}

function openDetail(id){
  const c=findItem(id);
  if(!c)return;
  const col=COLORS[c.ci||0];
  const isExam=c.type==='exam';
  const rows=isExam?[
    {lbl:t('date'),val:c.date||'—'},
    {lbl:t('time'),val:c.etime||'—'},
    {lbl:t('room'),val:c.room||'—'},
    {lbl:t('dept'),val:c.dept||'—'},
  ]:[
    {lbl:t('day'),val:dayLabel(c.day||'')},
    {lbl:`${t('startT')} – ${t('endT')}`,val:`${c.start||''}–${c.end||''}`},
    {lbl:t('room'),val:c.room||'—'},
    {lbl:t('doctor'),val:c.doctor||'—'},
  ];

  const icon=isExam?
    `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 15l2 2 4-4"/></svg>`:
    `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="13" y2="11"/></svg>`;

  document.getElementById('detail-content').innerHTML=`
    <div class="detail-top" style="background:${col.bar}"></div>
    <div class="detail-icon-row">
      <div class="detail-icon" style="background:${col.bar}">${icon}</div>
      <div>
        <div class="detail-name">${c.name}</div>
        <div class="detail-dept">${c.dept||''}</div>
      </div>
    </div>
    <div class="detail-grid">
      ${rows.map(r=>`<div class="d-cell"><div class="d-cell-lbl">${r.lbl}</div><div class="d-cell-val">${r.val}</div></div>`).join('')}
    </div>
    ${c.notes?`<div class="detail-notes"><div class="detail-notes-lbl">${t('notes')}</div><div class="detail-notes-val">${c.notes}</div></div>`:''}
    <div class="detail-actions">
      <button class="d-btn del" onclick="closeDetail();openEdit(${c.id});setTimeout(()=>document.getElementById('del-btn').click(),100)">
        <svg viewBox="0 0 24 24"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/><path d="M10,11v6"/><path d="M14,11v6"/><path d="M9,6V4a1,1,0,0,1,1-1h4a1,1,0,0,1,1,1V6"/></svg>
        ${t('del')}
      </button>
      <button class="d-btn edit" onclick="closeDetail();openEdit(${c.id})">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        ${t('edit')}
      </button>
    </div>
  `;
  document.getElementById('detail-overlay').classList.add('open');
}
function closeDetail(){document.getElementById('detail-overlay').classList.remove('open')}

// ===== ADD / EDIT =====
function openAdd(){
  addingType=currentTab==='exams'?'exam':'course';
  editingId=null;
  document.getElementById('edit-id').value='';
  document.getElementById('add-title').textContent=addingType==='exam'?t('addExam'):t('addCourse');
  document.getElementById('course-fields').style.display=addingType==='course'?'':'none';
  document.getElementById('exam-fields').style.display=addingType==='exam'?'':'none';
  document.getElementById('del-btn').style.display='none';
  clearForm();
  buildColorRow(0);
  document.getElementById('add-overlay').classList.add('open');
}

function openEdit(id){
  const c=findItem(id);
  if(!c)return;
  addingType=c.type;
  editingId=id;
  document.getElementById('edit-id').value=id;
  document.getElementById('add-title').textContent=c.type==='exam'?t('editExam'):t('editCourse');
  document.getElementById('course-fields').style.display=c.type==='course'?'':'none';
  document.getElementById('exam-fields').style.display=c.type==='exam'?'':'none';
  document.getElementById('del-btn').style.display='inline-flex';

  document.getElementById('f-name').value=c.name||'';
  document.getElementById('f-notes').value=c.notes||'';
  if(c.type==='course'){
    document.getElementById('f-doctor').value=c.doctor||'';
    document.getElementById('f-dept').value=c.dept||'';
    document.getElementById('f-day').value=c.day||'الاثنين';
    document.getElementById('f-room').value=c.room||'';
    document.getElementById('f-start').value=c.start||'08:00';
    document.getElementById('f-end').value=c.end||'10:00';
  } else {
    document.getElementById('f-date').value=c.date||'';
    document.getElementById('f-etime').value=c.etime||'09:00';
    document.getElementById('f-room2').value=c.room||'';
  }
  buildColorRow(c.ci||0);
  document.getElementById('add-overlay').classList.add('open');
}

function clearForm(){
  ['f-name','f-doctor','f-dept','f-room','f-room2','f-notes'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.value='';
  });
  document.getElementById('f-start').value='08:00';
  document.getElementById('f-end').value='10:00';
  const today=new Date().toISOString().split('T')[0];
  const fd=document.getElementById('f-date');if(fd)fd.value=today;
  document.getElementById('f-etime').value='09:00';
}

let selColor=0;
function buildColorRow(sel){
  selColor=sel;
  document.getElementById('color-row').innerHTML=COLORS.map((c,i)=>
    `<div class="cdot${i===sel?' sel':''}" style="background:${c.bar}" onclick="pickColor(${i})"></div>`
  ).join('');
}
function pickColor(i){selColor=i;buildColorRow(i)}

function saveItem(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert(lang==='ar'?'أدخل الاسم':lang==='tr'?'Ad girin':'Enter a name');return}

  if(editingId!==null){
    const arr=addingType==='course'?courses:exams;
    const idx=arr.findIndex(c=>c.id===editingId);
    if(idx>=0){
      if(addingType==='course'){
        arr[idx]={...arr[idx],name,doctor:document.getElementById('f-doctor').value.trim(),dept:document.getElementById('f-dept').value.trim(),day:document.getElementById('f-day').value,start:document.getElementById('f-start').value,end:document.getElementById('f-end').value,room:document.getElementById('f-room').value.trim(),notes:document.getElementById('f-notes').value.trim(),ci:selColor};
      } else {
        arr[idx]={...arr[idx],name,date:document.getElementById('f-date').value,etime:document.getElementById('f-etime').value,room:document.getElementById('f-room2').value.trim(),notes:document.getElementById('f-notes').value.trim(),ci:selColor};
      }
    }
  } else {
    if(addingType==='course'){
      courses.push({id:nid++,type:'course',name,doctor:document.getElementById('f-doctor').value.trim(),dept:document.getElementById('f-dept').value.trim(),day:document.getElementById('f-day').value,start:document.getElementById('f-start').value,end:document.getElementById('f-end').value,room:document.getElementById('f-room').value.trim(),notes:document.getElementById('f-notes').value.trim(),ci:selColor});
    } else {
      exams.push({id:nid++,type:'exam',name,dept:document.getElementById('f-dept')?document.getElementById('f-dept').value.trim():'',date:document.getElementById('f-date').value,etime:document.getElementById('f-etime').value,room:document.getElementById('f-room2').value.trim(),notes:document.getElementById('f-notes').value.trim(),ci:selColor});
    }
  }
  closeAdd();
  render();
}

function deleteItem(){
  if(!confirm(lang==='ar'?'حذف هذا العنصر؟':lang==='tr'?'Silmek istiyor musunuz?':'Delete this item?'))return;
  courses=courses.filter(c=>c.id!==editingId);
  exams=exams.filter(c=>c.id!==editingId);
  closeAdd();
  render();
}

function closeAdd(){document.getElementById('add-overlay').classList.remove('open')}

// ===== SETTINGS =====
function openSettings(){document.getElementById('settings-overlay').classList.add('open')}
function closeSettings(){document.getElementById('settings-overlay').classList.remove('open')}

function setTheme(cls,el){
  document.body.className=cls;
  currentTheme=cls;
  document.querySelectorAll('.theme-swatch').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
}

function setLang(l,el){
  lang=l;
  document.querySelectorAll('.lang-opt').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
  // update day select options
  const sel=document.getElementById('f-day');
  if(sel){
    const cur=sel.value;
    const days=getDays();
    sel.innerHTML=DAYS_AR.map((d,i)=>`<option value="${d}"${d===cur?' selected':''}>${days[i]}</option>`).join('');
  }
  render();
  // update settings labels
  document.getElementById('s-title').textContent=t('settings');
  document.getElementById('s-theme-lbl').textContent=t('theme');
  document.getElementById('s-close-btn').textContent=t('done');
}

// ===== BACKDROP CLICK =====
function handleOvClick(e,id){
  if(e.target===document.getElementById(id)){
    document.getElementById(id).classList.remove('open');
  }
}

// ===== INIT =====
render();
</script>
</body>
</html>
